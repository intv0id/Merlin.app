name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore MerlinFrontend.csproj

    - name: Build
      run: dotnet build MerlinFrontend.csproj --no-restore

    - name: Test
      run: dotnet test MerlinFrontend.csproj --no-build --verbosity normal
